:root[data-theme="dark"]{

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:32px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,38px);line-height:1;margin:0}

.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:12px;padding:14px 0}

summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.date{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.word{font-family:var(--f-display);font-size:24px;line-height:1.1;transition:color .2s}
.today .date{color:var(--accent)}
.row.done .word,.row.done .date{color:var(--gray)}
.row input{width:22px;height:22px;margin-top:16px;accent-color:var(--gray);cursor:pointer}
.info{padding:0 0 18px 108px;display:grid;gap:6px;min-width:0}
.info p{margin:0}
.th{font-weight:600;color:var(--accent)}
.en{color:var(--muted)}
.hist{margin-top:6px;padding:8px 12px;border-left:3px solid var(--line);font-size:14px;display:grid;gap:2px}
.hist b{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hist p{margin:0}.hth{color:var(--muted)}
ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:14px;align-items:baseline}
li i{font:500 10.5px var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.06em;background:var(--chip);border-radius:3px;padding:2px 0;text-align:center}
.note{width:100%;box-sizing:border-box;margin-top:10px;min-height:64px;resize:vertical;font:15px/1.5 var(--f-body);color:var(--ink);background:var(--paper);border:1px dashed var(--muted);border-radius:4px;padding:8px 10px}
.note:focus{outline:none;border-style:solid;border-color:var(--accent)}
.has-note .word::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
footer{margin-top:28px;color:var(--muted);font-size:12.5px}
@media (max-width:520px){summary{grid-template-columns:1fr;gap:2px}.info{padding-left:0}}
@media (prefers-reduced-motion:reduce){.word{transition:none}}
</style>

const KEY="inktober2026-done";
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const now=new Date(), today=(now.getFullYear()===2026&&now.getMonth()===9)?now.getDate():0;
const wd=d=>new Date(2026,9,d).toLocaleDateString("en-GB",{weekday:"short"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NKEY="inktober2026-notes";
let notes={};
try{notes=JSON.parse(localStorage.getItem(NKEY)||"{}")}catch(e){}
const list=document.getElementById("list");
list.innerHTML=P.map(([w,en,th,ideas],i)=>{const d=i+1;return `
<div class="row${d===today?" today":""}" data-d="${d}">
 <details><summary><span class="date">${wd(d)} ${String(d).padStart(2,"0")} Oct</span><span class="word">${w.toUpperCase()}</span></summary>
  <div class="info"><p class="th">${esc(th)}</p><p class="en">${esc(en)}</p>
  <div class="hist"><b>History · ที่มา</b><p>${esc(H[i][0])}</p><p class="hth">${esc(H[i][1])}</p></div>
  <ul>${ideas.map(([t,x])=>`<li><i class="${t}">${t}</i><span>${esc(x)}</span></li>`).join("")}</ul>
  <textarea class="note" id="n${d}" data-n="${d}" placeholder="Notes" aria-label="Note for ${w}"></textarea></div>
 </details>
 <input type="checkbox" id="c${d}" data-d="${d}" aria-label="Done: ${w}">
</div>`}).join("");
function render(){
  list.querySelectorAll(".row").forEach(r=>{const on=done.has(+r.dataset.d);r.classList.toggle("done",on);r.querySelector("input").checked=on});
  document.getElementById("count").textContent=done.size+" / 31";
}
list.addEventListener("change",e=>{const d=+e.target.dataset.d;if(!d)return;e.target.checked?done.add(d):done.delete(d);save();render()});
list.querySelectorAll(".note").forEach(t=>{const d=t.dataset.n;t.value=notes[d]||"";t.closest(".row").classList.toggle("has-note",!!t.value.trim())});
list.addEventListener("input",e=>{const d=e.target.dataset.n;if(!d)return;const v=e.target.value;
  v.trim()?notes[d]=v:delete notes[d];try{localStorage.setItem(NKEY,JSON.stringify(notes))}catch(x){}
  e.target.closest(".row").classList.toggle("has-note",!!v.trim())});
render();
</script>
